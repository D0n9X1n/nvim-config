name: Windows PowerShell

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Neovim 0.12 / ${{ matrix.shell }}
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned Neovim
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'nvim-win64.zip'
          Invoke-WebRequest -UseBasicParsing 'https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-win64.zip' -OutFile $zip
          $expected = 'de8625ba8cf65ebf40eb80a388ba1ec8e9c15b30218821e2c639119b05920de1'
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne $expected) { throw 'Neovim checksum mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'neovim'
          Expand-Archive -LiteralPath $zip -DestinationPath $destination
          Join-Path $destination 'nvim-win64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          python -m pip install pynvim
          if ($LASTEXITCODE -ne 0) { throw 'Python provider installation failed' }
      - name: Isolate configuration and plugin state
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'nvim-ci'
          foreach ($name in @('XDG_CONFIG_HOME', 'XDG_DATA_HOME', 'XDG_STATE_HOME', 'XDG_CACHE_HOME')) {
            $value = Join-Path $root $name
            "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          "NVIM_APPNAME=nvim-ci" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NVIM_WINDOWS_REPO=$env:GITHUB_WORKSPACE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Activate native compiler environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Install configured Windows dependencies
        timeout-minutes: 30
        run: |
          & .\scripts\windows-dependencies.ps1 -Mode Install
          if ($LASTEXITCODE -ne 0) { throw 'Windows dependency installation failed' }
      - name: Exclude Git Bash from the test path
        run: |
          $git = (Get-Command git.exe -ErrorAction Stop).Source
          $gitDirectory = Split-Path -Parent $git
          if (Test-Path -LiteralPath (Join-Path $gitDirectory 'bash.exe')) {
            $gitDirectory = Join-Path (Split-Path -Parent $gitDirectory) 'cmd'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $gitDirectory 'git.exe'))) { throw 'Native Git launcher not found' }
          $paths = $env:PATH -split ';' | Where-Object {
            $_ -and (($_ -ieq "$env:SystemRoot\System32") -or -not (Test-Path -LiteralPath (Join-Path $_ 'bash.exe')))
          }
          "PATH=$gitDirectory;$($paths -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Installer, shell, and build regressions
        run: |
          & .\scripts\windows-regression.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows regressions failed' }
      - name: Interactive PowerShell terminal
        env:
          NVIM_WINDOWS_SHELL: ${{ matrix.shell }}
        run: |
          python .\scripts\windows-terminal.py
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell terminal interaction failed' }
      - name: Install public configuration
        run: |
          & .\install.ps1 -NoDeps
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell installation failed' }
      - name: Install plugins in isolated CI directories
        run: |
          $ErrorActionPreference = 'Stop'
          $env:NVIM_SMOKE_SUCCESS = Join-Path $env:RUNNER_TEMP 'plugin-install.passed'
          $ErrorActionPreference = 'Continue'
          $output = & nvim --headless -i NONE -n --cmd "lua dofile(vim.env.NVIM_WINDOWS_REPO .. '/scripts/smoke-guard.lua')" -c 'Lazy! sync' -c "lua _G.smoke_command([[lua for name,p in pairs(require('lazy.core.config').plugins) do assert(p._.installed, name .. ' missing'); for _,task in ipairs(p._.tasks or {}) do assert(not task:has_errors(), name .. ': ' .. task:output()) end end]])" -c 'lua _G.smoke_finish()' -c 'qa!' 2>&1
          $status = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $output | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'plugin-install.log')
          if ($status -ne 0 -or -not (Test-Path -LiteralPath $env:NVIM_SMOKE_SUCCESS)) { throw 'Plugin setup failed' }
          if (($output -join "`n") -match '(?m)^Error\b|\bE\d{2,}:') { throw 'Plugin setup emitted an error' }
      - name: Installed configuration integration
        run: |
          & .\scripts\windows-regression.ps1 -Integration
          if ($LASTEXITCODE -ne 0) { throw 'Windows integration failed' }
      - name: Exercise external tools and language servers
        timeout-minutes: 15
        run: |
          & .\scripts\windows-dependencies.ps1 -Mode Test
          if ($LASTEXITCODE -ne 0) { throw 'Windows dependency integration failed' }
      - name: Collect failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-${{ matrix.shell }}-logs
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/plugin-install.log
            ${{ runner.temp }}/dependency-logs/
            ${{ runner.temp }}/nvim-ci/**/*.log
